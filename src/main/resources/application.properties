# Web/management is loopback-only as well.
server.address=127.0.0.1
server.port=18080

# --- Device gateway (TCP, loopback-only) ---
gateway.bind-host=127.0.0.1
gateway.port=19090
gateway.protocol-version=1
gateway.min-protocol-version=1
gateway.max-connections=64
gateway.max-frame-payload=4096
gateway.max-buffered-bytes=1048576
gateway.max-outbound-pending=256
gateway.max-retries=3
gateway.retry-interval-millis=200
gateway.downlink-timeout-millis=1000
gateway.enable-management=true

# Deterministic local test credentials (no real secrets).
gateway.credentials.dev-001.token=tok_valid_001
gateway.credentials.dev-001.expires-at=4102444800000
gateway.credentials.dev-expired.token=tok_expired
gateway.credentials.dev-expired.expires-at=1
