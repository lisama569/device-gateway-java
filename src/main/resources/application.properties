# ===== 设备接入网关配置（仅绑定本机回环 127.0.0.1）=====
# 监听端口
gateway.port=19000
# 最大并发连接数（信号量上限；线程数上限为 2 倍该值）
gateway.max-connections=64
# 单帧 payload 最大字节数（超长声明立即拒绝并重同步）
gateway.max-frame-length=8192
# 每连接接收残留硬上限（字节）：未拼成完整帧的缓冲上限，与单帧长度上限相互独立；
# 超限回 RECEIVE_BUFFER_FULL(4003) 并结束该连接，其他连接不受影响
gateway.max-receive-buffer-bytes=16384
# 能力协商：网关支持的协议版本区间（含端点）与可授予的能力项
gateway.protocol-min-version=1
gateway.protocol-max-version=1
gateway.supported-capabilities=priority,header-extension
# 每连接待发送帧队列上限（满则拒绝/降级，不无界排队）
gateway.max-outbound-per-session=256
# 下行可靠投递：ACK 超时与最大重传次数（总发送次数 = 1 + maxRetries）
gateway.ack-timeout-ms=3000
gateway.max-retries=3
# 上行序号去重窗口（回退在窗口内算重复，滑出窗口算过期）
gateway.seq-window=32
# 优雅关闭：静默期与总超时
gateway.shutdown-quiet-period-ms=100
gateway.shutdown-timeout-ms=5000
# 定时器/IO 线程数
gateway.io-worker-threads=4

logging.level.com.github.lisama569=INFO
